<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Adarsh Singh — Full-stack &amp; AI engineer</title>
    <meta
      name="description"
      content="Adarsh Singh is a full-stack developer and AI engineer from Indore building web applications, RAG systems and AI agents."
    />
    <meta property="og:title" content="Adarsh Singh — Full-stack &amp; AI engineer" />
    <meta property="og:description" content="Web applications, RAG systems and AI agents, built front to back." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@variable&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Pixelify+Sans:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          var dark = t ? t === 'dark' : true
          var r = document.documentElement
          r.classList.toggle('dark', dark)
          r.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
